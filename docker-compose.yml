services:
  mysql:
    image: mysql:8.4
    container_name: autobid-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: autobid
      MYSQL_USER: autobid
      MYSQL_PASSWORD: autobid
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - autobid_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autobid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - autobid_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  autobid_mysql_data:
  autobid_redis_data:
