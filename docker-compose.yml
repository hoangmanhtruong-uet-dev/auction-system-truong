services:
  mysql:
    image: mysql:8.4
    container_name: autobid-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: autobid
      MYSQL_USER: autobid
      MYSQL_PASSWORD: autobid
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - autobid_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  autobid_mysql_data:
