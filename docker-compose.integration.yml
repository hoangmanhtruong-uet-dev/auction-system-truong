name: auction-system-integration

services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: auction_system_test
      MYSQL_USER: integration_user
      MYSQL_PASSWORD: integration_password
      MYSQL_ROOT_PASSWORD: integration_root_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uintegration_user", "-pintegration_password"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis-test:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
